name: documentary-assembly
description: Transcript-first documentary with B-roll overlay, interview segments, and narration
version: 1.0
content_type: documentary
target_platform: youtube
output_lufs: -16

steps:
  - operation: probe
    tool: edit.info
    output: source_profile

  - operation: transcribe
    tool: edit.transcribe
    params:
      model: large
    output: transcript

  - operation: segment_by_topic
    tool: recipe.segment_by_topic
    params:
      min_segment_duration: 30
      max_segment_duration: 180
    output: topic_segments

  - operation: silence_remove
    tool: edit.silence_remove
    params:
      threshold: -50
      min_silence: 0.5
      padding: 0.3

  - operation: for_each_segment
    parallel: false
    loop_var: segment
    source: topic_segments
    steps:
      - operation: extract
        tool: edit.trim
        params:
          start: "$segment.start"
          duration: "$segment.duration"
          accurate: true

      - operation: j_l_cut_sequence
        tool: edit.j_l_cut_sequence
        params:
          lead_seconds: 0.8
          trail_seconds: 0.5

      - operation: color_grade
        tool: edit.color_grade
        params:
          style: warm

      - operation: render
        tool: edit.render
        params:
          profile: youtube-1080p

  - operation: merge_segments
    tool: edit.merge
    params:
      transition: fade
      transition_duration: 0.5

  - operation: add_captions
    tool: edit.text_subtitles
    params:
      style: documentary
      max_lines: 2
      chars_per_line: 42

  - operation: loudnorm
    tool: edit.loudnorm_limited
    params:
      target_lufs: -16
      true_peak: -1.0

  - operation: render
    tool: edit.render
    params:
      profile: youtube-1080p

quality_gates:
  - check: edit.verify
  - check: edit.quality_full_qc
  - check: lufs_within_1db
    target: -16
